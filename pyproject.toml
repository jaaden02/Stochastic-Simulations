[project]
name = "stochastic-simulations"
version = "0.1.0"
description = "Stochastic simulations library with fokker-planck and related methods"
readme = "README.md"
authors = [
    { name = "Jasper Aden", email = "jaaden@ethz.ch" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.8",
    "numba>=0.63.1",
    "numpy>=2.3.5",
    "scipy>=1.16.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["stochlib*"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=6.0.0",
]
